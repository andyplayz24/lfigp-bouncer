<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Check · LFIGP Bouncer</title>
<meta name="theme-color" content="#120e2b">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="scanner.js"></script>
<style>
  :root { --ink:#120e2b; --ink2:#1c1642; --line:#382f75; --text:#f7f2ff; --muted:#a99fd6; --pink:#ff4f8b; --mint:#3ee6a8; --sun:#ffc24b; --red:#ff5a6a; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ink); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font-size:26px; }
  p { margin:0; color:var(--muted); line-height:1.5; }
  .cam { position:relative; aspect-ratio:1/1; max-height:62vh; width:100%; border-radius:22px; overflow:hidden; background:#000; border:1px solid var(--line); }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tap { position:absolute; inset:0; border:0; background:transparent; color:var(--text); font-size:17px; font-weight:700; }
  .cam.live .tap { display:none; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; background:var(--ink2); border:1px solid var(--line); border-radius:16px; padding:14px; font-size:14px; }
  .row b { color:var(--muted); font-weight:600; }
  .row span { overflow-wrap:anywhere; }
  .hit { border-radius:18px; padding:18px; text-align:center; font-size:20px; font-weight:800; background:var(--ink2); border:1px solid var(--line); }
  .hit.ok { background:var(--mint); color:#062a1d; border-color:transparent; }
  button.b { padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--ink2); color:var(--text); font-size:15px; font-weight:700; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  a { color:var(--pink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Camera check</h1>
  <p>Open this before doors open. Point the camera at any QR code. If it turns green here, scanning will work at the door. Nothing is saved or checked in.</p>
  <div class="cam" id="box">
    <video id="v" playsinline muted autoplay></video>
    <button class="tap" id="tap" type="button">Tap to turn on camera</button>
  </div>
  <div class="hit" id="hit">Waiting for a QR code…</div>
  <div class="row">
    <b>Camera</b><span id="s">off</span>
    <b>Lens</b><span id="lens">–</span>
    <b>Should say</b><span>"Back Camera" on iPhone (the 1x lens)</span>
    <b>Reader</b><span id="eng">–</span>
    <b>Read time</b><span id="ms">–</span>
  </div>
  <button class="b" id="rs" type="button">Restart camera</button>
  <p><a href="app.html">Back to the Bouncer app</a></p>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var t0 = 0, n = 0;
  function onStatus(kind, info) {
    if (kind === 'starting') { t0 = Date.now(); $('s').textContent = 'starting… (tap Allow if asked)'; $('box').classList.remove('live'); }
    if (kind === 'live') { $('s').textContent = 'live'; $('lens').textContent = info || 'unknown'; $('box').classList.add('live'); t0 = Date.now();
      setTimeout(function () { $('eng').textContent = QRCam.engine(); }, 800); }
    if (kind === 'error') { $('s').textContent = 'error: ' + info; $('box').classList.remove('live'); }
    if (kind === 'restarting') $('s').textContent = 'restarting…';
  }
  function onCode(text) {
    n++;
    $('hit').className = 'hit ok';
    $('hit').textContent = 'Read #' + n + ': ' + text;
    $('ms').textContent = (Date.now() - t0) + ' ms after the camera started';
    if (navigator.vibrate) navigator.vibrate(60);
    QRCam.pause();
    setTimeout(function () { t0 = Date.now(); QRCam.resume(); }, 1500);
  }
  function go() { QRCam.start($('v'), onCode, onStatus); }
  $('tap').onclick = function () { QRCam.stop(); go(); };
  $('rs').onclick = function () { QRCam.stop(); go(); };
  go();
})();
</script>
</body>
</html>
